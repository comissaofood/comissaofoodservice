<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal de Comissões V9</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script><style>body{background:#f4f6f9}.container-main{max-width:1400px;margin:auto}#dashboard{display:none}.card-kpi{background:#0F172A;color:#fff;border-radius:12px;border:none}.kpi{color:#60A5FA;font-size:24px;font-weight:700}.table{font-size:13px}thead th{position:sticky;top:0;background:#0F172A;color:#fff}.topbar button{margin-left:8px}</style></head><body><div class="container-main p-3"><div id="login" class="col-md-4 mx-auto mt-5"><div class="card p-4 shadow"><h3>Portal de Comissões</h3><input id="codigo" class="form-control my-3" placeholder="Código do vendedor"><button class="btn btn-primary" onclick="entrar()">Entrar</button></div></div><div id="dashboard"><div class="d-flex justify-content-between align-items-center mb-3"><div><h2>Portal de Comissões</h2><div id="representante"></div></div><div class="topbar"><button class="btn btn-success" onclick="baixarMinhaBase()">📥 Baixar Minha Base</button><button class="btn btn-secondary" onclick="location.reload()">🔄 Trocar Vendedor</button></div></div><div class="row g-2 mb-3"><div class="col"><div class="card card-kpi p-2"><small>Comissão</small><div id="kpiTotal" class="kpi"></div></div></div><div class="col"><div class="card card-kpi p-2"><small>Pedidos</small><div id="kpiPedidos" class="kpi"></div></div></div><div class="col"><div class="card card-kpi p-2"><small>Clientes</small><div id="kpiClientes" class="kpi"></div></div></div><div class="col"><div class="card card-kpi p-2"><small>CNPJs</small><div id="kpiCnpjs" class="kpi"></div></div></div></div><ul class="nav nav-tabs"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#nf">EMITIR NF</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#det">DETALHES</button></li></ul><div class="tab-content bg-white border p-3"><div class="tab-pane fade show active" id="nf"><h3 class="text-success mb-3" id="totalReceber"></h3><div class="d-flex justify-content-end mb-2"><button type="button" class="btn btn-outline-secondary btn-sm" data-bs-toggle="collapse" data-bs-target="#nfFiltros" aria-expanded="false" aria-controls="nfFiltros">Filtros</button></div><div class="collapse" id="nfFiltros"><div class="row g-2 mb-3"><div class="col-1"><select id="nfAno" class="form-select" onchange="ajustarMeses('nfMes');filtrarNf()"><option value="">Ano</option></select></div><div class="col-2"><select id="nfMes" class="form-select" multiple onchange="filtrarNf()"><option value="">Mês</option></select></div><div class="col"><input id="nfPedido" class="form-control" placeholder="Pedido" onkeyup="filtrarNf()"></div><div class="col"><input id="nfCliente" class="form-control" placeholder="Cliente" onkeyup="filtrarNf()"></div><div class="col"><input id="nfMaterial" class="form-control" placeholder="Material" onkeyup="filtrarNf()"></div><div class="col"><input id="nfCnpj" class="form-control" placeholder="CNPJ" onkeyup="filtrarNf()"></div><div class="col"><input id="nfStatus" class="form-control" placeholder="Status" onkeyup="filtrarNf()"></div></div></div><div class="table-responsive"><table class="table table-striped"><thead><tr><th>Descrição CD</th><th>Número do Pedido</th><th>CNPJ</th><th>STATUS</th><th>Comissão</th></tr></thead><tbody id="nfBody"></tbody></table></div></div><div class="tab-pane fade" id="det"><div class="d-flex justify-content-end mb-2"><button type="button" class="btn btn-outline-secondary btn-sm" data-bs-toggle="collapse" data-bs-target="#detFiltros" aria-expanded="false" aria-controls="detFiltros">Filtros</button></div><div class="collapse" id="detFiltros"><div class="row g-2 mb-3"><div class="col-1"><select id="fAno" class="form-select" onchange="ajustarMeses('fMes');filtrar()"><option value="">Ano</option></select></div><div class="col-2"><select id="fMes" class="form-select" multiple onchange="filtrar()"><option value="">Mês</option></select></div><div class="col"><input id="fPedido" class="form-control" placeholder="Pedido" onkeyup="filtrar()"></div><div class="col"><input id="fCliente" class="form-control" placeholder="Cliente" onkeyup="filtrar()"></div><div class="col"><input id="fMaterial" class="form-control" placeholder="Material" onkeyup="filtrar()"></div><div class="col"><input id="fCnpj" class="form-control" placeholder="CNPJ" onkeyup="filtrar()"></div><div class="col"><input id="fStatus" class="form-control" placeholder="Status" onkeyup="filtrar()"></div></div></div><div class="table-responsive"><table class="table table-bordered table-hover"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div></div></div></div><script>let dados=[];let vendedor=[];let anos=[],meses=[];fetch('Resumo Comissões.xlsx').catch(()=>fetch('ResumoComissões.xlsx')).then(r=>r.arrayBuffer()).then(b=>{const wb=XLSX.read(b,{type:'array'});dados=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);});const moeda=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function entrar(){const cod=document.getElementById('codigo').value.trim();vendedor=dados.filter(x=>String(x.Vendedor)===cod);if(!vendedor.length){alert('Vendedor não encontrado');return;}document.getElementById('login').style.display='none';document.getElementById('dashboard').style.display='block';montaFiltrosAnoMes();render(vendedor);}function montaFiltrosAnoMes(){const anosSet=new Set(vendedor.map(x=>x['Ano']).filter(a=>a!==undefined&&a!==null&&a!==''));anos=[...anosSet].sort((a,b)=>b-a);document.getElementById('fAno').innerHTML='<option value="">Ano</option>'+anos.map(a=>`<option value="${a}">${a}</option>`).join('');const mesesSet=new Set(vendedor.map(x=>x['Mês']).filter(m=>m!==undefined&&m!==null&&m!==''));const ordemMeses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];meses=[...mesesSet].sort((a,b)=>ordemMeses.indexOf(a)-ordemMeses.indexOf(b));document.getElementById('fMes').innerHTML='<option value="">Mês</option>'+meses.map(m=>`<option value="${m}">${m}</option>`).join('');document.getElementById('nfAno').innerHTML=document.getElementById('fAno').innerHTML;document.getElementById('nfMes').innerHTML=document.getElementById('fMes').innerHTML;}function render(lista){document.getElementById('representante').innerHTML='<strong>'+(lista[0]['Vendedor Padrão']||'')+'</strong>';const total=lista.reduce((a,b)=>a+Number(b['Valor comissão']||0),0);kpiTotal.innerText=moeda(total);totalReceber.innerText='TOTAL A RECEBER: '+moeda(total);kpiPedidos.innerText=new Set(lista.map(x=>x['Número do Pedido'])).size;kpiClientes.innerText=new Set(lista.map(x=>x['Descrição Cliente'])).size;kpiCnpjs.innerText=new Set(lista.map(x=>x['CNPJ'])).size;const consolidado={};lista.forEach(x=>{const pedido=x['Número do Pedido']||'';const cnpj=x['CNPJ']||'';const chave=`${pedido}|${cnpj}`;if(!consolidado[chave]){consolidado[chave]={descricaoCD:x['Descrição CD']||'',pedido,cnpj,comissao:0};}consolidado[chave].comissao+=Number(x['Valor comissão']||0);});nfBody.innerHTML=Object.values(consolidado).map(x=>`<tr><td>${x.descricaoCD}</td><td>${x.pedido}</td><td>${x.cnpj}</td><td>${moeda(x.comissao)}</td></tr>`).join('');montaDetalhes(lista);}function montaDetalhes(lista){if(!lista.length){thead.innerHTML='';tbody.innerHTML='';return;}thead.innerHTML='<tr>'+Object.keys(lista[0]).map(c=>'<th>'+c+'</th>').join('')+'</tr>';tbody.innerHTML=lista.map(r=>'<tr>'+Object.values(r).map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('');}function filtrar(){const anoFiltro=fAno.value;const mesFiltro=fMes.value;const p=fPedido.value.toLowerCase(),c=fCliente.value.toLowerCase(),m=fMaterial.value.toLowerCase(),cn=fCnpj.value.toLowerCase(),s=fStatus.value.toLowerCase();let f=vendedor.filter(x=>{if(anoFiltro&&x['Ano']!==undefined&&String(x['Ano'])!==anoFiltro)return false;if(mesFiltro&&x['Mês']!==undefined&&String(x['Mês']).toLowerCase()!==mesFiltro.toLowerCase())return false;return String(x['Número do Pedido']||'').toLowerCase().includes(p)&&String(x['Descrição Cliente']||'').toLowerCase().includes(c)&&String(x['Texto breve material']||'').toLowerCase().includes(m)&&String(x['CNPJ']||'').toLowerCase().includes(cn)&&String(x['Status']||'').toLowerCase().includes(s);});const total=f.reduce((a,b)=>a+Number(b['Valor comissão']||0),0);kpiTotal.innerText=moeda(total);totalReceber.innerText='TOTAL A RECEBER: '+moeda(total);kpiPedidos.innerText=new Set(f.map(x=>x['Número do Pedido'])).size;kpiClientes.innerText=new Set(f.map(x=>x['Descrição Cliente'])).size;kpiCnpjs.innerText=new Set(f.map(x=>x['CNPJ'])).size;montaDetalhes(f);}function renderNf(lista){const consolidado={};lista.forEach(x=>{const pedido=x['Número do Pedido']||'';const cnpj=x['CNPJ']||'';const chave=`${pedido}|${cnpj}`;if(!consolidado[chave]){consolidado[chave]={descricaoCD:x['Descrição CD']||'',pedido,cnpj,comissao:0};}consolidado[chave].comissao+=Number(x['Valor comissão']||0);});nfBody.innerHTML=Object.values(consolidado).map(x=>`<tr><td>${x.descricaoCD}</td><td>${x.pedido}</td><td>${x.cnpj}</td><td>${moeda(x.comissao)}</td></tr>`).join('');}function filtrarNf(){const anoFiltro=nfAno.value;const mesFiltro=nfMes.value;const p=nfPedido.value.toLowerCase(),c=nfCliente.value.toLowerCase(),m=nfMaterial.value.toLowerCase(),cn=nfCnpj.value.toLowerCase(),s=nfStatus.value.toLowerCase();const f=vendedor.filter(x=>{if(anoFiltro&&x['Ano']!==undefined&&String(x['Ano'])!==anoFiltro)return false;if(mesFiltro&&x['Mês']!==undefined&&String(x['Mês']).toLowerCase()!==mesFiltro.toLowerCase())return false;return String(x['Número do Pedido']||'').toLowerCase().includes(p)&&String(x['Descrição Cliente']||'').toLowerCase().includes(c)&&String(x['Texto breve material']||'').toLowerCase().includes(m)&&String(x['CNPJ']||'').toLowerCase().includes(cn)&&String(x['Status']||'').toLowerCase().includes(s);});renderNf(f);}function baixarMinhaBase(){const ws=XLSX.utils.json_to_sheet(vendedor);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Detalhes');XLSX.writeFile(wb,'Minha_Base_'+document.getElementById('codigo').value+'.xlsx');}</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script>
function ajustarMeses(id){const el=document.getElementById(id);if(!el)return;const todos=el.querySelector('option[value="__TODOS__"]');const selecionados=Array.from(el.selectedOptions);if(selecionados.some(o=>o.value==='__TODOS__')&&selecionados.length>1){Array.from(el.options).forEach(o=>o.selected=o.value==='__TODOS__');}else if(selecionados.some(o=>o.value!=='__TODOS__')&&todos){todos.selected=false;}if(!Array.from(el.selectedOptions).length&&todos)todos.selected=true;}
function valoresSelecionados(id){const el=document.getElementById(id);return el?Array.from(el.selectedOptions).map(o=>String(o.value).toLowerCase()):[];}
function valorInput(id){const el=document.getElementById(id);return el?String(el.value||'').trim().toLowerCase():'';}
function passaFiltros(x,prefix){const ano=valorInput(prefix+'Ano');const meses=valoresSelecionados(prefix+'Mes');const pedido=valorInput(prefix+'Pedido');const cliente=valorInput(prefix+'Cliente');const material=valorInput(prefix+'Material');const cnpj=valorInput(prefix+'Cnpj');const status=valorInput(prefix+'Status');if(ano&&String(x['Ano']??'').toLowerCase()!==ano)return false;if(meses.length&&!meses.includes('__todos__')&&!meses.includes(String(x['Mês']??'').toLowerCase()))return false;return String(x['Número do Pedido']??'').toLowerCase().includes(pedido)&&String(x['Descrição Cliente']??'').toLowerCase().includes(cliente)&&String(x['Texto breve material']??x['Material']??'').toLowerCase().includes(material)&&String(x['CNPJ']??'').toLowerCase().includes(cnpj)&&String(x['Status']??'').toLowerCase().includes(status);}
function listaFiltrada(prefix){return vendedor.filter(x=>passaFiltros(x,prefix));}
function atualizarCards(lista){const total=lista.reduce((a,b)=>a+Number(b['Valor comissão']||0),0);document.getElementById('kpiTotal').innerText=moeda(total);document.getElementById('totalReceber').innerText='TOTAL A RECEBER: '+moeda(total);document.getElementById('kpiPedidos').innerText=new Set(lista.map(x=>x['Número do Pedido'])).size;document.getElementById('kpiClientes').innerText=new Set(lista.map(x=>x['Descrição Cliente'])).size;document.getElementById('kpiCnpjs').innerText=new Set(lista.map(x=>x['CNPJ'])).size;}
function renderNf(lista){const consolidado={};lista.forEach(x=>{const pedido=x['Número do Pedido']||'';const cnpj=x['CNPJ']||'';const chave=`${pedido}|${cnpj}`;if(!consolidado[chave])consolidado[chave]={descricaoCD:x['Descrição CD']||'',pedido,cnpj,statuses:new Set(),comissao:0};consolidado[chave].statuses.add(String(x['Status']||''));consolidado[chave].comissao+=Number(x['Valor comissão']||0);});document.getElementById('nfBody').innerHTML=Object.values(consolidado).map(x=>`<tr><td>${x.descricaoCD}</td><td>${x.pedido}</td><td>${x.cnpj}</td><td>${Array.from(x.statuses).filter(Boolean).join(', ')}</td><td>${moeda(x.comissao)}</td></tr>`).join('');}
function atualizarTabelas(lista){renderNf(lista);montaDetalhes(lista);}
function render(lista){const nome=lista[0]?lista[0]['Vendedor Padrão']||'':'';document.getElementById('representante').innerHTML='<strong>'+nome+'</strong>';atualizarCards(lista);atualizarTabelas(lista);}
function filtrar(){const lista=listaFiltrada('f');atualizarCards(lista);atualizarTabelas(lista);}
function filtrarNf(){const lista=listaFiltrada('nf');atualizarCards(lista);atualizarTabelas(lista);}
function montaFiltrosAnoMes(){const anosSet=new Set(vendedor.map(x=>x['Ano']).filter(a=>a!==undefined&&a!==null&&a!==''));anos=[...anosSet].sort((a,b)=>b-a);const opAno='<option value="">Ano</option>'+anos.map(a=>`<option value="${a}">${a}</option>`).join('');document.getElementById('fAno').innerHTML=opAno;document.getElementById('nfAno').innerHTML=opAno;const ordemMeses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];const mesesSet=new Set(vendedor.map(x=>x['Mês']).filter(m=>m!==undefined&&m!==null&&m!==''));meses=[...mesesSet].sort((a,b)=>ordemMeses.indexOf(a)-ordemMeses.indexOf(b));const opMes='<option value="__TODOS__" selected>Todos os meses</option>'+meses.map(m=>`<option value="${m}">${m}</option>`).join('');document.getElementById('fMes').innerHTML=opMes;document.getElementById('nfMes').innerHTML=opMes;}
function entrar(){const cod=document.getElementById('codigo').value.trim();vendedor=dados.filter(x=>String(x.Vendedor)===cod);if(!vendedor.length){alert('Vendedor não encontrado');return;}document.getElementById('login').style.display='none';document.getElementById('dashboard').style.display='block';montaFiltrosAnoMes();render(vendedor);}
</script></body></html>
